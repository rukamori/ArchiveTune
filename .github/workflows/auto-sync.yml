name: Auto Sync and Build
on:
  schedule:
    - cron: "0 6 * * 1" # Runs automatically every Monday morning
  workflow_dispatch: # Adds a button to run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: am-blend
          
      - name: Sync with Main Rukamori Repo
        run: |
          git config user.name "auto-sync"
          git config user.email "sync@local"
          git remote add upstream https://github.com/rukamori/ArchiveTune.git
          git fetch upstream main
          # Pulls stable updates but keeps your Apple Music UI safe from overwrites
          git merge -X ours upstream/main -m "auto-sync stable" || true
          git push origin am-blend || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          
      - name: Build APK
        run: ./gradlew assembleDebug
        
      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: archivetune-apple-ui
          path: app/build/outputs/apk/debug/*.apk

name: auto-sync-stable
on:
  schedule:
    - cron: "0 6 * * 1" # Runs once a week (Mondays) at 6 AM UTC
  workflow_dispatch:    # Allows manual trigger from Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: am-blend
          fetch-depth: 0
          submodules: false

      - name: Sync Stable Release Only
        run: |
          git config user.name "auto-sync"
          git config user.email "sync@local"
          git remote add upstream https://github.com/rukamori/ArchiveTune.git || true
          git fetch upstream --tags

          LATEST_TAG=$(git describe --tags $(git rev-list --tags --max-count=1))
          echo "Syncing to stable tag: $LATEST_TAG"

          git merge -X ours "$LATEST_TAG" -m "auto-sync stable $LATEST_TAG" || true

      - name: Init & Update Submodules Safely
        run: |
          git submodule sync --recursive
          git submodule init
          git submodule foreach --recursive '
            sha=$(git config --file "$toplevel/.git/config" --get "submodule.$name.url" >/dev/null; git -C "$toplevel" ls-tree -d HEAD "$sm_path" | awk "{print \$3}")
            echo "Updating submodule $name ($sm_path) -> $sha"
            if ! git fetch --depth 1 origin "$sha" 2>/dev/null; then
              echo "Exact SHA $sha not advertised; fetching default branch instead"
              git fetch --depth 1 --no-tags origin
            fi
            git checkout --detach FETCH_HEAD
          '
          git submodule update --init --recursive || true

      - name: Push Updated Branch
        run: |
          git push origin am-blend || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: archivetune-stable
          path: app/build/outputs/apk/debug/*.apk

name: Build & Sign Release APK
on:
  push:
    branches: [ am-blend ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: am-blend

      - name: Init submodules safely
        run: |
          git config --global fetch.recurseSubmodules false
          git submodule sync --recursive || true
          git submodule update --init --recursive || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore Permanent Keystore
        run: |
          # Create the exact folder structure the app's build.gradle expects
          mkdir -p app/keystore
          # Decode your secret into the keystore file
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > app/keystore/release.keystore
          # Verify it's not empty (should be around 2KB)
          ls -lh app/keystore/release.keystore

      - name: Build & Sign GMS Release APK
        env:
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          # These env vars tell Gradle to use the keystore we just created
          KEYSTORE_PASSWORD: mysecretpassword
          KEY_ALIAS: archive-tune
          KEY_PASSWORD: mysecretpassword
          GRADLE_OPTS: "-Xmx4g"
        # Gradle will automatically sign the APK during this step!
        run: ./gradlew assembleGmsMobileUniversalRelease --no-daemon --parallel

      - name: Save Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: archivetune-gms-release
          path: app/build/outputs/apk/**/*.apk

name: Build Release APK (Optimized)
on:
  push:
    branches: [ am-blend ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: am-blend

      - name: Init submodules safely
        run: |
          git config --global fetch.recurseSubmodules false
          git submodule sync --recursive || true
          git submodule update --init --recursive || true
          git submodule foreach 'git fetch --all || true' || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # --- THIS CACHE SPEEDS UP FUTURE BUILDS MASSIVELY ---
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare Temporary Keystore
        run: |
          # Generates a dummy keystore so Release builds don't crash
          keytool -genkey -v -keystore release.keystore -alias releasekey -keyalg RSA -keysize 2048 -validity 10000 -storepass temp1234 -keypass temp1234 -dname "CN=Temp, OU=Temp, O=Temp, L=Temp, S=Temp, C=US" -noprompt
          echo "storeFile=release.keystore" > keystore.properties
          echo "storePassword=temp1234" >> keystore.properties
          echo "keyAlias=releasekey" >> keystore.properties
          echo "keyPassword=temp1234" >> keystore.properties

      - name: Build GMS Release APK
        env:
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          # Limits memory so the runner doesn't freeze up
          GRADLE_OPTS: "-Xmx4g" 
        # Building ONLY GMS to save 20 minutes.
        run: ./gradlew assembleGmsMobileUniversalRelease --no-daemon --parallel

      - name: Save Release APK
        uses: actions/upload-artifact@v4
        with:
          name: archivetune-gms-release
          path: app/build/outputs/apk/**/release/*.apk

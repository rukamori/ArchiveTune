name: Build & Sign Release APK
on:
  push:
    branches: [ am-blend ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: am-blend

      - name: Init submodules safely
        run: |
          git config --global fetch.recurseSubmodules false
          git submodule sync --recursive || true
          git submodule update --init --recursive || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore Permanent Keystore
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > release.keystore
          # Verify the keystore isn't empty (prevents silent failures)
          ls -lh release.keystore

      - name: Build GMS Release APK
        env:
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          GRADLE_OPTS: "-Xmx4g"
        run: ./gradlew assembleGmsMobileUniversalRelease --no-daemon --parallel

      - name: Download uber-apk-signer
        run: wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: Sign the APK with Permanent Key
        run: |
          # Single line command with explicit JKS type to prevent password prompt errors
          java -jar uber-apk-signer-1.3.0.jar --apks $(find app/build/outputs/apk -name "*.apk" | head -n 1) --ks release.keystore --ksAlias archive-tune --ksPass mysecretpassword --keyPass mysecretpassword --ksType JKS

      - name: Save Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: archivetune-gms-release
          path: app/build/outputs/apk/**/*.apk

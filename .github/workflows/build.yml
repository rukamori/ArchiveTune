name: Build APKs
on:
  push:
    branches: [ am-blend ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: am-blend

      - name: Init submodules safely
        run: |
          git config --global fetch.recurseSubmodules false
          git submodule sync --recursive || true
          git submodule update --init --recursive || true
          git submodule foreach 'git fetch --all || true' || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build GMS and FOSS Phone APKs (Fast)
        env:
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
        # This ONLY builds standard mobile versions (skips TV/Car/Watch/Emulators)
        run: ./gradlew assembleGmsMobileDebug assembleFossMobileDebug

      - name: Save APKs
        uses: actions/upload-artifact@v4
        with:
          name: archivetune-gms-foss-mobile
          path: |
            app/build/outputs/apk/gms/mobile/debug/*.apk
            app/build/outputs/apk/foss/mobile/debug/*.apk

name: Check Duplicate Issues

on:
  issues:
    types:
      - opened
      - edited

permissions:
  contents: read
  issues: write

concurrency:
  group: duplicate-check-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  duplicate-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check scikit-learn requests

      - name: Check for duplicate issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          REPOSITORY: ${{ github.repository }}
        run: python duplicate_checker.py "$ISSUE_TITLE" "$ISSUE_BODY" "$REPOSITORY"

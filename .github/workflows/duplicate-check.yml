name: Check Duplicate Issues

on:
  issues:
    types:
      - opened
      - edited
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to check. Leave empty to scan all open issues.
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: duplicate-check-${{ github.repository }}-${{ github.event.issue.number || inputs.issue_number || 'all-open' }}
  cancel-in-progress: true

jobs:
  duplicate-check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.state == 'open' &&
       github.event.issue.user.type != 'Bot' &&
       (github.event.action == 'opened' ||
        github.event.changes.title != null ||
        github.event.changes.body != null))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check scikit-learn requests

      - name: Check new or edited issue
        if: github.event_name == 'issues'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body || '' }}
          REPOSITORY: ${{ github.repository }}
          DUPLICATE_SIMILARITY_THRESHOLD: ${{ vars.DUPLICATE_SIMILARITY_THRESHOLD }}
        run: python duplicate_checker.py "$ISSUE_TITLE" "$ISSUE_BODY" "$REPOSITORY"

      - name: Check requested issue or scan all open issues
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ISSUE_NUMBER: ${{ inputs.issue_number }}
          REPOSITORY: ${{ github.repository }}
          DUPLICATE_SIMILARITY_THRESHOLD: ${{ vars.DUPLICATE_SIMILARITY_THRESHOLD }}
        run: python duplicate_checker.py --manual "$REPOSITORY"

name: Build & Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build FluentMusic APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate translation contributors
        run: |
          if [ -f scripts/generate_translation_contributors.py ]; then
            python scripts/generate_translation_contributors.py || true
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: on-success

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Universal Debug & Release APKs
        run: |
          ./gradlew assembleGmsMobileUniversalDebug assembleGmsMobileUniversalRelease --stacktrace

      - name: Prepare APK Outputs
        run: |
          mkdir -p release_artifacts
          echo "Finding all generated APKs..."
          find app/build/outputs/apk -type f -name "*.apk"

          # Copy debug APK
          DEBUG_APK=$(find app/build/outputs/apk -type f -name "*universal*debug*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" release_artifacts/FluentMusic-universal-debug.apk
            echo "Copied debug APK: $DEBUG_APK -> release_artifacts/FluentMusic-universal-debug.apk"
          fi

          # Copy release APK
          RELEASE_APK=$(find app/build/outputs/apk -type f -name "*universal*release*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" release_artifacts/FluentMusic-universal-release.apk
            echo "Copied release APK: $RELEASE_APK -> release_artifacts/FluentMusic-universal-release.apk"
          fi

          # Also copy any other universal APKs if found
          find app/build/outputs/apk -type f -name "*.apk" -exec cp {} release_artifacts/ \;

          ls -la release_artifacts

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FluentMusic-APKs
          path: release_artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "FluentMusic ${{ github.ref_name }}"
          files: release_artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

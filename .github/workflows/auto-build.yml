name: Auto Sync and Build
on:
  schedule:
    - cron: "0 6 * * 1" 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: am-blend
          # Do NOT use submodules: recursive here, we handle it manually below
      
      - name: Initialize Submodules Safely
        run: |
          # 1. Temporarily disable "stop on error" so missing commits don't crash the build
          set +e
          
          echo "Syncing submodules..."
          git submodule sync --recursive || true
          
          echo "Attempting standard update (will ignore missing commit errors)..."
          git submodule update --init --recursive || true
          
          echo "Forcing submodules to latest available commits..."
          git submodule foreach 'git fetch origin || true'
          git submodule foreach 'git reset --hard origin/main || git reset --hard origin/master || true'
          
          # 2. Re-enable "stop on error" for the actual build steps
          set -e
          
      - name: Sync with Main Rukamori Repo
        run: |
          git config user.name "auto-sync"
          git config user.email "sync@local"
          git remote add upstream https://github.com/rukamori/ArchiveTune.git || true
          git fetch upstream main
          git merge -X ours upstream/main -m "auto-sync stable" || true
          git push origin am-blend || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          
      - name: Build All APKs (Debug, GMS Release, FOSS Release)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: ./gradlew assemble
        
      - name: Save All APKs
        uses: actions/upload-artifact@v4
        with:
          name: archivetune-all-variants
          path: app/build/outputs/apk/**/*.apk
